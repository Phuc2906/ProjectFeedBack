<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FeedLoop – Quản lý feedback sản phẩm</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#f3f6fa;--ink:#14213d;--mut:#64708a;--line:#e2e8f1;--pri:#3b5bdb;--pri2:#e7ecff;--bad:#d6455d;--r:14px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font:15px/1.55 'Be Vietnam Pro',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
h1{font-size:25px;line-height:1.25}
h3{font-size:16px;margin-bottom:12px}
.sub{color:var(--mut);margin:2px 0 20px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--ink);color:#cdd6ec;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:20px;color:#fff;padding:0 10px 18px;display:flex;gap:10px;align-items:center}
.logo{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#7c97ff,#3b5bdb);display:grid;place-items:center;font-size:16px}
.side nav a{display:block;padding:10px 12px;border-radius:10px;font-weight:500}
.side nav a:hover{background:#ffffff14}.side nav a.on{background:var(--pri);color:#fff}
.me{margin-top:auto;padding:12px;border-radius:12px;background:#ffffff12;font-size:13px}
.me b{display:block;color:#fff}.me button{margin-top:8px;background:none;border:1px solid #ffffff40;color:#fff;border-radius:8px;padding:4px 10px;cursor:pointer}
.main{padding:30px 36px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.stat b{display:block;font-size:30px;line-height:1.1}.stat span{color:var(--mut);font-size:13px}
.btn{border:0;background:var(--pri);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:var(--pri2);color:var(--pri)}.btn.bad{background:#fdebee;color:var(--bad)}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;width:100%}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 4px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.bar>*{width:auto;flex:1;min-width:150px}.bar input{flex:2}
.row{display:flex;gap:14px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.row:hover{background:#f7f9ff}.row .t{flex:1;min-width:0}.row .t b{display:block}
.row .t span{color:var(--mut);font-size:13px}
.vote{border:1px solid var(--line);background:#fff;border-radius:10px;min-width:56px;padding:6px 8px;text-align:center;cursor:pointer;font-weight:700;line-height:1.25}
.vote small{display:block;font-weight:400;color:var(--mut);font-size:11px}.vote:hover{border-color:var(--pri);color:var(--pri)}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.tag{display:inline-block;background:#eef1f6;color:var(--mut);padding:2px 9px;border-radius:7px;font-size:12px;margin:0 4px 4px 0}
.tag u{cursor:pointer;margin-left:5px;text-decoration:none}
.hb{display:grid;grid-template-columns:120px 1fr 28px;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.hb i{display:block;height:10px;border-radius:6px;min-width:3px}.hb em{font-style:normal;text-align:right;font-weight:600}
.mini{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}.mini:last-child{border:0}.mini b{color:var(--pri);min-width:26px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;margin-top:12px}
.body{white-space:pre-wrap;margin:14px 0}
.back{color:var(--pri);font-weight:600}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;align-items:start}
.col{background:#e8edf6;border-radius:var(--r);padding:12px}.col h3{margin:0 0 4px;display:flex;justify-content:space-between}
.kc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;display:block}
.kc small{color:var(--mut)}
.seg{display:inline-flex;background:#e8edf6;border-radius:10px;padding:3px;margin-bottom:16px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0001}
table{width:100%;border-collapse:collapse}td,th{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
th{color:var(--mut);font-weight:600;font-size:13px}td select{width:auto}
.empty{color:var(--mut);padding:24px;text-align:center}
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh}
.hero{background:linear-gradient(160deg,#14213d,#27407f);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero h2{font-size:38px;line-height:1.2;max-width:460px}.hero p{color:#c3cff0;max-width:420px}
.form{display:grid;place-items:center;padding:30px}.form form{width:min(380px,100%)}
.form .btn{width:100%;margin-top:18px;padding:11px}.form p{margin-top:14px;color:var(--mut);font-size:14px}.form a{color:var(--pri);font-weight:600;cursor:pointer}
.err{color:var(--bad);font-size:14px;margin-top:10px}
.modal{position:fixed;inset:0;background:#14213d99;display:grid;place-items:center;padding:16px;z-index:9}
.modal .card{width:min(540px,100%);max-height:92vh;overflow:auto}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:12px;z-index:20}
.toast.bad{background:var(--bad)}
@media(max-width:820px){
.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}
.brand{padding:0 8px 0 0}.side nav{display:flex;gap:2px;overflow:auto;flex:1}.side nav a{white-space:nowrap;padding:8px 10px}.me{display:none}
.main{padding:20px 16px}.split{grid-template-columns:1fr}.auth{grid-template-columns:1fr}.hero{padding:30px}.hero h2{font-size:28px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<body>

<div id="auth" class="auth" hidden></div>

<div id="app" class="app" hidden>
    <aside class="side">
        <div class="brand"><span class="logo">↻</span>FeedLoop</div>
        <nav id="nav"></nav>
        <div class="me">
            <b id="meName"></b>
            <span id="meRole"></span><br>
            <button onclick="logout()">Đăng xuất</button>
        </div>
    </aside>
    <main class="main" id="main"></main>
</div>

<div id="modal" class="modal" hidden></div>

<script>
/* =========================================================
   CẤU HÌNH BACKEND DJANGO
========================================================= */

const CFG = {
    API: (() => {
        try {
            return localStorage.getItem('api');
        } catch (e) {
            return null;
        }
    })() || 'http://127.0.0.1:8000/api',

    AUTH: 'Bearer',

    EP: {
        login: '/token/',
        register: '/register/',
        me: '/taikhoan/me/',
        fb: '/phanhoi/',
        products: '/sanpham/',
        tags: '/tag/',
        vote: '/binhchon/',
        roadmap: '/roadmap/',
        groups: '/nhomai/',
        users: '/users/',
        ai: '/ai/insights/'
    }
};


/* =========================================================
   TIỆN ÍCH
========================================================= */

const $ = s => document.querySelector(s);

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
}[c]));

const ls = (k, v) => {
    try {
        if (v === undefined) return localStorage.getItem(k);
        if (v === null) return localStorage.removeItem(k);
        return localStorage.setItem(k, v);
    } catch (e) {}
};

const arr = d => Array.isArray(d) ? d : d?.results || [];

const S = {
    token: ls('tk'),
    user: JSON.parse(ls('us') || 'null'),
    fbs: [],
    users: [],
    tags: [],
    products: [],
    votes: [],
    roadmaps: [],
    groups: []
};

let CUR = null;
let redraw = null;


/* =========================================================
   TRẠNG THÁI THEO BACKEND
   Backend hiện sử dụng:
   Pending / In Progress / Done
========================================================= */

const ST = {
    'Pending': ['Chờ xử lý', '#b7791f', '#fff4dc'],
    'In Progress': ['Đang xử lý', '#e8590c', '#ffeadb'],
    'Done': ['Hoàn thành', '#2f9e6b', '#e0f6ec']
};

const stl = s => ST[s] || [s || 'Chưa xác định', '#64708a', '#eef1f6'];

const chip = s => {
    const [l, c, b] = stl(s);
    return `<span class="chip" style="color:${c};background:${b}">${esc(l)}</span>`;
};


/* =========================================================
   VAI TRÒ
   Backend trả vai_tro: Product / CS / Dev
========================================================= */

const ROLES = {
    Product: 'Product',
    CS: 'CS',
    Dev: 'Dev'
};

const getRole = () => {
    return S.user?.vai_tro || S.user?.role || null;
};

const isStaff = () => !!S.token;

const canAdmin = () => getRole() === 'Product';


const fdate = d => {
    const x = new Date(d);
    return isNaN(x) ? '' : x.toLocaleDateString('vi-VN');
};


/* =========================================================
   CHUYỂN DỮ LIỆU BACKEND SANG GIAO DIỆN
========================================================= */

function getTagNames(tagIds) {
    if (!Array.isArray(tagIds)) return [];

    return tagIds.map(id => {
        const tag = S.tags.find(t => t.ma_tag === id);
        return tag ? tag.ten_tag : null;
    }).filter(Boolean);
}

function nf(o) {
    return {
        id: o.ma_phan_hoi,
        title: o.tieu_de || '(Không có tiêu đề)',
        desc: o.noi_dung || '',
        status: o.trang_thai || 'Pending',
        tagIds: Array.isArray(o.tags) ? o.tags : [],
        tags: getTagNames(o.tags),
        votes: S.votes.filter(v => {
            const feedbackId = v.ma_phan_hoi;
            return Number(feedbackId) === Number(o.ma_phan_hoi);
        }).length,
        by: o.ten_nguoi_gui || 'Ẩn danh',
        email: o.email_nguoi_gui || '',
        at: o.ngay_tao || '',
        src: o.nguon_tiep_nhan || '',
        productId: o.ma_san_pham,
        accountId: o.ma_tai_khoan
    };
}


/* =========================================================
   THÔNG BÁO VÀ XỬ LÝ LỖI
========================================================= */

function toast(m, bad) {
    const t = document.createElement('div');
    t.className = 'toast' + (bad ? ' bad' : '');
    t.textContent = m;
    document.body.append(t);
    setTimeout(() => t.remove(), 3200);
}

const safe = fn => async (...a) => {
    try {
        return await fn(...a);
    } catch (e) {
        toast(e.message, true);
    }
};

const errMsg = d => {
    if (!d) return '';
    if (typeof d === 'string') return d;
    if (d.detail) return d.detail;

    const v = Object.entries(d)[0];

    return v
        ? (Array.isArray(v[1]) ? v[1][0] : v[1])
        : '';
};


/* =========================================================
   HÀM GỌI API
========================================================= */

async function api(path, {method = 'GET', body} = {}) {
    const h = {
        'Content-Type': 'application/json'
    };

    if (S.token) {
        h.Authorization = CFG.AUTH + ' ' + S.token;
    }

    let r;

    try {
        r = await fetch(CFG.API + path, {
            method,
            headers: h,
            body: body !== undefined ? JSON.stringify(body) : undefined
        });
    } catch (e) {
        throw Error(
            'Không kết nối được Backend tại ' + CFG.API +
            '. Hãy bật Django server và kiểm tra CORS.'
        );
    }

    if (r.status === 401 && S.token && !path.includes('/token/')) {
        logout();
        throw Error('Phiên đăng nhập đã hết hạn.');
    }

    const d = r.status === 204
        ? null
        : await r.json().catch(() => null);

    if (!r.ok) {
        throw Error(errMsg(d) || 'Lỗi HTTP ' + r.status);
    }

    return d;
}


/* =========================================================
   MODAL
========================================================= */

function modal(html) {
    const m = $('#modal');
    m.innerHTML = `<div class="card">${html}</div>`;
    m.hidden = false;

    m.onclick = e => {
        if (e.target === m) closeM();
    };
}

function closeM() {
    $('#modal').hidden = true;
}


/* =========================================================
   TẢI DỮ LIỆU TỪ BACKEND
========================================================= */

async function loadTags() {
    S.tags = arr(await api(CFG.EP.tags));
}

async function loadVotes() {
    S.votes = arr(await api(CFG.EP.vote));
}

async function loadFb() {
    await loadTags();
    await loadVotes();

    const data = arr(await api(CFG.EP.fb));
    S.fbs = data.map(nf);
}

async function loadProducts() {
    S.products = arr(await api(CFG.EP.products));
}

async function loadRoadmaps() {
    S.roadmaps = arr(await api(CFG.EP.roadmap));
}


/* =========================================================
   ĐĂNG NHẬP / ĐĂNG KÝ
========================================================= */

function showAuth(mode = 'login') {
    $('#app').hidden = true;

    const a = $('#auth');
    a.hidden = false;

    const reg = mode === 'register';

    a.innerHTML = `
        <section class="hero">
            <div class="logo" style="width:44px;height:44px;font-size:22px">↻</div>
            <h2>Biến feedback của khách hàng thành roadmap</h2>
            <p>Gom góp ý từ nhiều nguồn, để AI nhóm các ý trùng lặp và cho biết nên làm gì trước.</p>
        </section>

        <section class="form">
            <form onsubmit="doAuth(event,${reg})">
                <h1>${reg ? 'Tạo tài khoản' : 'Đăng nhập'}</h1>

                <label>Tên đăng nhập</label>
                <input name="username" required autocomplete="username">

                ${reg ? `
                    <label>Email</label>
                    <input name="email" type="email" required>
                ` : ''}

                <label>Mật khẩu</label>
                <input name="password" type="password" required minlength="6"
                    autocomplete="${reg ? 'new' : 'current'}-password">

                <div class="err" id="aerr"></div>

                <button class="btn">
                    ${reg ? 'Đăng ký' : 'Đăng nhập'}
                </button>

                <p>
                    ${reg
                        ? `Đã có tài khoản? <a onclick="showAuth()">Đăng nhập</a>`
                        : `Chưa có tài khoản? <a onclick="showAuth('register')">Đăng ký</a>`
                    }
                </p>

                <p>
                    Backend: <code>${esc(CFG.API)}</code>
                    · <a onclick="setApi()">Đổi địa chỉ</a>
                </p>
            </form>
        </section>
    `;
}


function setApi() {
    const v = prompt(
        'Địa chỉ API Backend (ví dụ: https://ten-app.onrender.com/api)',
        CFG.API
    );

    if (v) {
        ls('api', v.replace(/\/$/, ''));
        location.reload();
    }
}


async function doAuth(e, reg) {
    e.preventDefault();

    const f = Object.fromEntries(new FormData(e.target));
    const b = e.target.querySelector('.btn');

    b.disabled = true;

    try {
        if (reg) {
            await api(CFG.EP.register, {
                method: 'POST',
                body: f
            });
        }

        const d = await api(CFG.EP.login, {
            method: 'POST',
            body: {
                username: f.username,
                password: f.password
            }
        });

        S.token = d.access || d.token || d.key;

        if (!S.token) {
            throw Error('Backend không trả về access token.');
        }

        ls('tk', S.token);

        // Lấy thông tin tài khoản từ API /taikhoan/me/
        S.user = await api(CFG.EP.me);

        ls('us', JSON.stringify(S.user));

        location.hash = '#/dashboard';
        route();

    } catch (x) {
        $('#aerr').textContent = x.message;
        b.disabled = false;
    }
}


function logout() {
    S.token = null;
    S.user = null;

    ls('tk', null);
    ls('us', null);

    location.hash = '';
    showAuth();
}


/* =========================================================
   ROUTER
========================================================= */

const V = {
    dashboard,
    inbox,
    detail,
    roadmap,
    ai,
    users
};

const NAV = [
    ['dashboard', 'Tổng quan'],
    ['inbox', 'Hộp thư'],
    ['roadmap', 'Roadmap'],
    ['ai', 'Insight AI'],
    ['users', 'Người dùng']
];

async function route() {
    if (!S.token) {
        showAuth();
        return;
    }

    $('#auth').hidden = true;
    $('#app').hidden = false;

    const [p, id] = location.hash.slice(2).split('/');
    const cur = V[p] ? p : 'dashboard';

    $('#meName').textContent =
        S.user?.ho_ten || S.user?.username || 'Tài khoản';

    $('#meRole').textContent =
        ROLES[getRole()] || 'Tài khoản nội bộ';

    $('#nav').innerHTML = NAV
        .filter(n => n[0] !== 'users' || canAdmin())
        .map(n => `
            <a href="#/${n[0]}"
                class="${(cur === n[0] || (cur === 'detail' && n[0] === 'inbox')) ? 'on' : ''}">
                ${n[1]}
            </a>
        `).join('');

    $('#main').innerHTML = '<p class="sub">Đang tải…</p>';
    redraw = null;

    try {
        await V[cur](id);
    } catch (e) {
        $('#main').innerHTML = `
            <div class="card">
                <h3>Không tải được dữ liệu</h3>
                <p class="sub">${esc(e.message)}</p>
                <button class="btn" onclick="route()">Thử lại</button>
            </div>
        `;
    }
}

addEventListener('hashchange', route);


/* =========================================================
   TỔNG QUAN
========================================================= */

async function dashboard() {
    await loadFb();

    const f = S.fbs;
    const countStatus = s => f.filter(x => x.status === s).length;

    const tags = {};

    f.forEach(x => {
        x.tags.forEach(t => {
            tags[t] = (tags[t] || 0) + 1;
        });
    });

    const top = [...f]
        .sort((a, b) => b.votes - a.votes)
        .slice(0, 5);

    const max = Math.max(1, ...Object.keys(ST).map(s => countStatus(s)));

    $('#main').innerHTML = `
        <h1>Tổng quan</h1>
        <p class="sub">Tình hình feedback của sản phẩm</p>

        <div class="grid g4">
            ${[
                ['Tổng feedback', f.length],
                ['Chờ xử lý', countStatus('Pending')],
                ['Đang xử lý', countStatus('In Progress')],
                ['Đã hoàn thành', countStatus('Done')],
                ['Tổng lượt vote', f.reduce((a, x) => a + x.votes, 0)]
            ].map(([l, n]) => `
                <div class="card stat">
                    <b>${n}</b>
                    <span>${l}</span>
                </div>
            `).join('')}
        </div>

        <div class="grid g2" style="margin-top:14px">
            <div class="card">
                <h3>Theo trạng thái</h3>

                ${Object.keys(ST).map(s => `
                    <div class="hb">
                        <span>${stl(s)[0]}</span>
                        <i style="width:${countStatus(s) / max * 100}%;background:${stl(s)[1]}"></i>
                        <em>${countStatus(s)}</em>
                    </div>
                `).join('')}
            </div>

            <div class="card">
                <h3>Được vote nhiều nhất</h3>

                ${top.map(x => `
                    <a class="mini" href="#/detail/${x.id}">
                        <b>${x.votes}</b>
                        <span>${esc(x.title)}</span>
                    </a>
                `).join('') || '<p class="empty">Chưa có feedback nào.</p>'}
            </div>
        </div>

        <div class="card" style="margin-top:14px">
            <h3>Tag phổ biến</h3>

            ${Object.entries(tags)
                .sort((a, b) => b[1] - a[1])
                .map(([t, n]) => `
                    <span class="tag">${esc(t)} · ${n}</span>
                `).join('') || '<span class="sub">Chưa có tag.</span>'}
        </div>
    `;
}


/* =========================================================
   HỘP THƯ FEEDBACK
========================================================= */

async function inbox() {
    await loadFb();

    const tags = [...new Set(S.fbs.flatMap(x => x.tags))];

    $('#main').innerHTML = `
        <div class="top">
            <div>
                <h1>Hộp thư feedback</h1>
                <p class="sub">Góp ý từ form, email, chat và cộng đồng</p>
            </div>

            <button class="btn" onclick="edit()">Thêm feedback</button>
        </div>

        <div class="bar">
            <input id="q" placeholder="Tìm theo tiêu đề hoặc nội dung…">

            <select id="fs">
                <option value="">Mọi trạng thái</option>
                ${Object.keys(ST).map(s => `
                    <option value="${s}">${stl(s)[0]}</option>
                `).join('')}
            </select>

            <select id="ft">
                <option value="">Mọi tag</option>
                ${tags.map(t => `
                    <option>${esc(t)}</option>
                `).join('')}

    redraw = () => {
        const q = $('#q').value.toLowerCase();
        const s = $('#fs').value;
        const t = $('#ft').value;

        const l = S.fbs
            .filter(x =>
                (!q || (x.title + x.desc).toLowerCase().includes(q)) &&
                (!s || x.status === s) &&
                (!t || x.tags.includes(t))
            )
            .sort((a, b) =>
                $('#fo').value === 'v'
                    ? b.votes - a.votes

            );

        $('#list').innerHTML = l.map(x => `
            <div class="row" onclick="location.hash='#/detail/${x.id}'">

                <button class="vote" onclick="vote(event,${x.id})">
                    ▲ ${x.votes}
                    <small>vote</small>
                </button>

                <div class="t">
                    <b>${esc(x.title)}</b>

                    <span>
                        ${esc(x.by)}
                        ${x.at ? ' · ' + fdate(x.at) : ''}
                        ${x.src ? ' · ' + esc(x.src) : ''}
                    </span>

                    <div>
                        ${x.tags.map(t => `

/* =========================================================

   Tag là bảng riêng, feedback lưu danh sách ma_tag
========================================================= */

const addTag = async e => {
    if (e.key !== 'Enter') return;

    e.preventDefault();

    const v = e.target.value.trim();

    if (!v || CUR.tags.includes(v)) return;

    try {
        let tag = S.tags.find(t =>
            t.ten_tag.toLowerCase() === v.toLowerCase() &&
            Number(t.ma_san_pham) === Number(CUR.productId)
        );

        if (!tag) {
            tag = await api(CFG.EP.tags, {
                method: 'POST',
                body: {
                    ten_tag: v,
                    ma_san_pham: CUR.productId
                }
            });

            S.tags.push(tag);
        }

        const ids = [...CUR.tagIds, tag.ma_tag];

        await api(CFG.EP.fb + CUR.id + '/', {
            method: 'PATCH',
            body: {
                tags: ids
            }
        });

        toast('Đã thêm tag');
        route();

    } catch (x) {
        toast(x.message, true);
    }
};


const rmTag = safe(async t => {
    const tag = S.tags.find(x => x.ten_tag === t);

    if (!tag) return;

    const ids = CUR.tagIds.filter(id => id !== tag.ma_tag);

    await api(CFG.EP.fb + CUR.id + '/', {
        method: 'PATCH',
        body: {
            tags: ids
        }
    });

    toast('Đã xóa tag khỏi feedback');
    route();
});

const save = safe(async (e, isEdit) => {
    e.preventDefault();

    const f = Object.fromEntries(new FormData(e.target));

    const productId = isEdit
        ? CUR.productId
        : Number(f.productId);

    const body = {
        tieu_de: f.title,
        noi_dung: f.description,
        ten_nguoi_gui: f.sender,
        email_nguoi_gui: f.email,
        nguon_tiep_nhan: f.source
    };

    if (!isEdit) {
        body.ma_san_pham = productId;
    }

    if (f.status) {
        body.trang_thai = f.status;
    }

    // Chuyển tên tag thành ma_tag trước khi gửi Backend
    const tagNames = f.tags
        .split(',')
        .map(t => t.trim())
        .filter(Boolean);

    const tagIds = [];

    for (const name of tagNames) {
        let tag = S.tags.find(t =>
            t.ten_tag.toLowerCase() === name.toLowerCase() &&
            Number(t.ma_san_pham) === Number(productId)
        );

        if (!tag) {
            tag = await api(CFG.EP.tags, {
                method: 'POST',
                body: {
                    ten_tag: name,
                    ma_san_pham: productId
                }
            });

            S.tags.push(tag);
        }

        tagIds.push(tag.ma_tag);
    }

    body.tags = tagIds;

    await api(
        CFG.EP.fb + (isEdit ? CUR.id + '/' : ''),
        {
            method: isEdit ? 'PATCH' : 'POST',
            body
        }
    );

    closeM();
    toast('Đã lưu feedback');
    route();
});

/* =========================================================
   INSIGHT AI
   Backend hiện chưa có API /ai/insights/
   Tạm giữ thuật toán phân tích cục bộ để giao diện vẫn dùng được.
========================================================= */

function localAI() {
    const stop = new Set(
        'của và các cho với một những được này khi trong không có để là the and for'.split(' ')
    );

    const tok = x => new Set(
        ((x.title + ' ' + x.desc).toLowerCase().match(/[\p{L}\d]+/gu) || [])
            .filter(w => w.length > 2 && !stop.has(w))
    );

    const f = S.fbs;
    const T = f.map(tok);
    const p = f.map((_, i) => i);

    const find = i => p[i] === i ? i : p[i] = find(p[i]);

    for (let i = 0; i < f.length; i++) {
        for (let j = i + 1; j < f.length; j++) {
            const sh = [...T[i]].filter(w => T[j].has(w)).length;
            const m = Math.min(T[i].size, T[j].size) || 1;

            if (
                sh / m >= 0.5 ||
                f[i].tags.some(t => f[j].tags.includes(t))
            ) {
                p[find(j)] = find(i);
            }
        }
    }

    const g = {};

    f.forEach((x, i) => {
        (g[find(i)] ??= []).push(x.id);
    });

    return Object.values(g).map(ids => {
        const m = ids.map(id => f.find(x => x.id === id));
        const tc = {};

        m.forEach(x => {
            x.tags.forEach(t => {
                tc[t] = (tc[t] || 0) + 1;
            });
        });

        const top = Object.entries(tc).sort((a, b) => b[1] - a[1])[0];

        return {
            title: top ? top[0] : m[0].title,
            summary: `${m.length} góp ý tương tự, tổng ${m.reduce((a, x) => a + x.votes, 0)} lượt vote. Ví dụ: “${m[0].title}”.`,
            ids
        };
    });
}


async function ai() {
    await loadFb();

    $('#main').innerHTML = `
        <div class="top">
            <div>
                <h1>Insight bằng AI</h1>
                <p class="sub">
                    Gom feedback trùng lặp, tóm tắt insight và đề xuất mức ưu tiên
                </p>
            </div>

            <button class="btn" id="run">
                Phân tích ${S.fbs.length} feedback
            </button>
        </div>

        <div id="out"></div>
    `;

    $('#run').onclick = async () => {
        const b = $('#run');

        b.disabled = true;
        b.textContent = 'Đang phân tích…';

        // Hiện tại chưa có API AI trong Backend.
        // Dùng localAI để giữ chức năng phân tích trên giao diện.
        const cl = localAI();

        cl.forEach(c => {
            const m = c.ids
                .map(id => S.fbs.find(x => x.id === id))
                .filter(Boolean);

            c.items = m;
            c.votes = m.reduce((a, x) => a + x.votes, 0);
            c.score = c.votes + 2 * m.length;
        });

        const mx = Math.max(1, ...cl.map(c => c.score));

        cl.sort((a, b) => b.score - a.score);

        cl.forEach(c => {
            c.priority = c.score >= 0.66 * mx
                ? 'high'
                : c.score >= 0.33 * mx
                    ? 'medium'
                    : 'low';
        });

        const P = {
            high: ['Ưu tiên cao', '#d6455d', '#fdebee'],
            medium: ['Ưu tiên vừa', '#b7791f', '#fff4dc'],
            low: ['Ưu tiên thấp', '#64708a', '#eef1f6']
        };

        window.CL = cl;

        $('#out').innerHTML = `
            <p class="sub">
                Đang sử dụng phân tích cục bộ theo từ khóa và tag.
                Chưa kết nối AI Backend.
            </p>

            <div class="grid">
                ${cl.map((c, i) => {
                    const p = P[c.priority] || P.low;

                    return `
                        <div class="card">
                            <div class="top">
                                <h3>${esc(c.title)}</h3>

                                <span class="chip"
                                    style="color:${p[1]};background:${p[2]}">
                                    ${p[0]}
                                </span>
                            </div>

                            <p>${esc(c.summary)}</p>

                            <p class="sub" style="margin:8px 0">
                                ${c.items.length} feedback · ${c.votes} lượt vote
                            </p>

                            ${c.items.map(x => `
                                <a class="mini" href="#/detail/${x.id}">
                                    <b>▲ ${x.votes}</b>
                                    <span>${esc(x.title)}</span>
                                </a>
                            `).join('')}

                            <button class="btn ghost" style="margin-top:12px"
                                onclick="draft(${i})">
                                Tạo nháp phản hồi khách hàng
                            </button>
                        </div>
                    `;
                }).join('') || '<p class="empty">Chưa có feedback để phân tích.</p>'}
            </div>
        `;

        b.disabled = false;
        b.textContent = 'Phân tích lại';
    };
}
